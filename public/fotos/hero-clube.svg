<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ambiente da barbearia Lâmina, com luz quente">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2a2018"/>
      <stop offset="0.55" stop-color="#1d1712"/>
      <stop offset="1" stop-color="#120d09"/>
    </linearGradient>
    <radialGradient id="light" cx="0.78" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#c79a4b" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#c79a4b" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#c79a4b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="26" height="26" fill="none"/>
      <rect x="0" width="2" height="26" fill="#efe9dd" opacity="0.025"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <rect width="1600" height="1040" fill="url(#stripes)"/>
  <rect width="1600" height="1040" fill="url(#light)"/>

  <!-- comb teeth motif, bottom -->
  <g fill="#c79a4b" opacity="0.16">
    <g>
      <rect x="170" y="760" width="3" height="120"/><rect x="190" y="760" width="3" height="120"/>
      <rect x="210" y="760" width="3" height="120"/><rect x="230" y="760" width="3" height="120"/>
      <rect x="250" y="760" width="3" height="120"/><rect x="270" y="760" width="3" height="120"/>
      <rect x="290" y="760" width="3" height="120"/><rect x="310" y="760" width="3" height="120"/>
      <rect x="160" y="744" width="170" height="18"/>
    </g>
  </g>

  <!-- faint oversized monogram -->
  <text x="1240" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="640" font-style="italic" fill="#efe9dd" opacity="0.05" text-anchor="middle">L</text>

  <!-- brass spine + frame -->
  <rect x="56" y="56" width="1488" height="928" fill="none" stroke="#c79a4b" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="120" y="56" width="2" height="928" fill="#c79a4b" opacity="0.4"/>

  <text x="150" y="950" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="10" fill="#efe9dd" opacity="0.7">LÂMINA · DESDE 2014</text>

  <rect width="1600" height="1040" filter="url(#grain)" opacity="0.8"/>
</svg>
