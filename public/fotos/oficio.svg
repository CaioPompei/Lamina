<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ferramentas de barbearia sobre a bancada">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#271f18"/>
      <stop offset="1" stop-color="#140f0a"/>
    </linearGradient>
    <radialGradient id="light2" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#e0bd78" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e0bd78" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg2)"/>
  <rect width="1200" height="1500" fill="url(#light2)"/>

  <!-- straight razor silhouette -->
  <g transform="rotate(-28 600 760)" opacity="0.5">
    <rect x="360" y="742" width="430" height="36" rx="18" fill="#c79a4b" opacity="0.5"/>
    <rect x="360" y="744" width="430" height="14" rx="7" fill="#e0bd78" opacity="0.55"/>
    <rect x="788" y="734" width="150" height="52" rx="14" fill="#3a2c1d"/>
    <circle cx="800" cy="760" r="6" fill="#e0bd78"/>
  </g>

  <rect x="48" y="48" width="1104" height="1404" fill="none" stroke="#c79a4b" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="80" y="1410" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="9" fill="#efe9dd" opacity="0.6">O OFÍCIO</text>
  <rect width="1200" height="1500" filter="url(#grain2)" opacity="0.8"/>
</svg>
